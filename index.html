    <meta name="twitter:title" content="Trends — the launchpad that runs inside the tweet">
    <meta name="twitter:description" content="Launch coins, trade, and claim fees without leaving X. Tap PLAY, sign in with your X account — no install.">
    <meta name="twitter:image" content="https://trendsx.trends.fm/trends-logo.jpg">

    <meta name="twitter:player:width" content="1280">
    <meta name="twitter:player:height" content="720">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://trendsx.trends.fm/">

    <meta property="og:image:width" content="1200">
